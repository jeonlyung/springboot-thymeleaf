plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
    // [모니터링] 서버 상태 및 메트릭 지표 확인용
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // [스케줄러] SFTP 전송 등 정기 배치 작업 관리용
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    // [통신] 외부 API 호출을 위한 최신 인터페이스 (동기 방식)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    // [보안] 로그인 및 접근 권한 제어
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // [화면] JSP를 대체하는 표준 HTML 템플릿 엔진
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // [검증] 입력된 데이터의 유효성 체크 및 에러 방지
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // [통신] 고성능/대량 데이터 처리를 위한 비동기 통신 도구
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    // [보안연동] 타임리프 화면에서 로그인 정보 및 권한 제어 활용
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // [코드자동화] Getter, Setter 등 반복 코드 생성 제거
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // [개발편의] 소스 수정 시 서버 자동 재시작 지원
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // [설정지원] application.yml 작성 시 자동완성 기능 제공
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    // [문서화] 테스트 코드를 기반으로 API 명세서 자동 생성
    testImplementation 'org.springframework.boot:spring-restdocs'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    
    // 테스트용 라이브러리 모음
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-quartz-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
