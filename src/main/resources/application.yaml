spring:
  application:
    name: springboot-thymeleaf

  # [Multipart]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true
    encoding:
      charset: UTF-8
      force: true

  # [Thymeleaf]
  thymeleaf:
    cache: false
    prefix: classpath:/templates/pages/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  # [Resources]
  web:
    resources:
      static-locations: classpath:/static/
      chain:
        cache: false

  # [Message]
  messages:
    basename: i18n/messages
    encoding: UTF-8

  # [Batch]
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  # [AOP]
  aop:
    proxy-target-class: true

  # [DataSource] ㅡㅡ+ 이 부분이 spring 바로 밑에 있어야 DB가 연결됩니다!
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/dangdang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: MungMarketPool
      connection-timeout: 30000

  # [Security & OAuth2] ㅡㅡ+
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:c76d5e136e0dd70d927875be8a5e217c}
            client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: ${NAVER_CLIENT_ID:your-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:your-naver-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# [MyBatis] ㅡㅡ+ 최상위 레벨
mybatis:
  # DTO가 모여있는 패키지 경로를 지정함
  type-aliases-package: com.project.springboot_thymeleaf.biz.**.dto
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    #카멜 형식 자동 매핑
    map-underscore-to-camel-case: true

# [Server] ㅡㅡ+ 최상위 레벨
server:
  port: 8080
  servlet:
    context-path: /

# [JWT 설정] ㅡㅡ+ 최신 트렌드: Stateless 인증
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-change-this-in-production-environment}
  access-token-expiration: 3600000 # 1시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)

# [SFTP] ㅡㅡ+ 최상위 레벨
sftp:
  hosts:
    - 123.456.78.10
    - 123.456.78.20
    - 123.456.78.30
  port: 22
  user: myuser
  password: mypassword

  # 다운로드 전용 설정
  download:
    host: 10.00.00.0
    user: test
    password: test
    port: 22
    local-path: /app/files/

# [Logging] ㅡㅡ+ 최상위 레벨
logging:
  level:
    com.zaxxer.hikari: TRACE
    org.springframework.jdbc: DEBUG

# [Management/Actuator] ㅡㅡ+ 최상위 레벨
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always