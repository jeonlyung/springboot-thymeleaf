spring:
  application:
    name: springboot-thymeleaf

    # [Multipart] ?? ??? ?? ?? ??
    servlet:
      multipart:
        max-file-size: 50MB          # ?? ? ?? ?? ??
        max-request-size: 100MB      # ? ?? ??(?? ?? ??)? ?? ??
        enabled: true

    # [Thymeleaf] ? ??? ?? ??
    thymeleaf:
      cache: false                   # ?? ??? false? ???? ?? ? ???? ? ?? ???
      prefix: classpath:/templates/
      suffix: .html
      mode: HTML
      encoding: UTF-8

    # [Resources] ?? ??(JS, CSS) ??
    web:
      resources:
        static-locations: classpath:/static/
        chain:
          cache: false               # ??? JS ?? ?? ? ?? ??? ?? ?? ??

  # [Message] message.xml ?? (?? ?? ??)
  messages:
    basename: i18n/messages
    encoding: UTF-8

  # [Batch] batch.xml ?? (?? ??? ?? ???)
  batch:
    job:
      enabled: false # ?? ? ?? ?? ??
    jdbc:
      initialize-schema: never

  # [AOP] aop.xml ?? (??? ??? ??)
  aop:
    proxy-target-class: true

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/dangdang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}

mybatis:
  # Mapper XML 파일 위치
  mapper-locations: classpath:mapper/*.xml
  # VO(DTO) 패키지 경로 (XML에서 짧은 이름 사용 가능)
  type-aliases-package: com.example.demo.model
  configuration:
    # 카멜케이스 자동 변환 (db_column -> dbColumn)
    map-underscore-to-camel-case: true

# [Server] ?? ?? ??
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true


# SFTP
sftp:
