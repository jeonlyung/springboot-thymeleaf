spring:
  application:
    name: springboot-thymeleaf

  # 데이터베이스 설정 (MariaDB)
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/dangdang_db?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_ID}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Thymeleaf 설정
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding: UTF-8

  # 메시지 소스 설정
  messages:
    basename: message/messages
    encoding: UTF-8
    cache-duration: -1

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # OAuth2 클라이언트 설정
  security:
    oauth2:
      client:
        registration:
          # Google OAuth2
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET_KEY}
            scope:
              - email
              - profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google

          # Naver OAuth2
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_SECRET_KEY}
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/naver

          # Kakao OAuth2
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_SECRET_KEY}
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-authentication-method: client_secret_post

        provider:
          # Naver Provider 설정
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          # Kakao Provider 설정
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      password:                          # 비밀번호 없으면 빈 칸
      timeout: 5000ms                    # 연결 타임아웃
      lettuce:
        pool:
          max-active: 8                  # 최대 커넥션
          max-idle: 8                    # 최대 유휴 커넥션
          min-idle: 2                    # 최소 유휴 커넥션
          max-wait: -1ms                 # 대기 시간 (-1 = 무제한)

# MyBatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.project.springboot_thymeleaf.biz.**.dto
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 설정
jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-change-this-in-production-environment-please-use-strong-random-key
  access-token-expiration: 3600000      # 1시간 (밀리초)
  refresh-token-expiration: 604800000   # 7일 (밀리초)

# SFTP 설정
sftp:
  hosts:
    - sftp-server-1.example.com
    - sftp-server-2.example.com
  port: 22
  user: your-sftp-username
  password: your-sftp-password
  download:
    host: sftp-download.example.com
    port: 22
    user: your-download-username
    password: your-download-password
    local-path: /tmp/downloads

# 로깅 설정
logging:
  level:
    root: INFO
    com.project.springboot_thymeleaf: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always        # Redis 포함 전체 상태 항상 노출 (운영에선 when-authorized 권장)

# 서버 설정
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    whitelabel:
      enabled: false


# 챗봇 ↔ ai-serving(라우터) 연동. 키는 환경변수로만 주입한다.
chatbot:
  enabled: ${CHATBOT_ENABLED:true}
  # 어떤 LLM 에 붙을지: openai = ai-serving/Ollama/vLLM 같은 자체 구축(OpenAI 호환), claude = Anthropic API(외부)
  # 바꿀 때는 CHATBOT_PROVIDER 환경변수만 바꾸고 재기동하면 된다.
  provider: ${CHATBOT_PROVIDER:openai}
  # 아래 두 줄은 provider=claude 일 때만 쓴다. 키는 절대 여기 적지 말고 환경변수로만 넣을 것
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  anthropic-model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
  # 아래 base-url / api-key / model 은 provider=openai 일 때 쓰는 값
  base-url: ${AI_SERVING_BASE_URL:http://localhost:8000/v1}
  api-key: ${AI_SERVING_API_KEY:}
  model: ${AI_SERVING_MODEL:answer}       # 카탈로그 id 또는 별칭(answer/classify/agent)
  max-tokens: 1024
  rate-limit-per-minute: 20               # IP 당
