    <!DOCTYPE html>
    <html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>댕댕이 월드 로그인</title>
        <link rel="stylesheet" th:href="@{/css/login.css}">
    </head>

    <body>
    <div class="login-container">
        <div class="paw-icon">🐾</div>
        <h1>댕댕이 마켓</h1>
        <p>로그인하여 댕댕이 친구들을 만나보세요!</p>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </form>

        <div class="social-login-divider">또는 소셜 계정으로 로그인</div>

        <div class="social-login-buttons">
            <a th:href="@{/oauth2/authorization/google}" class="btn-social google">
                <span class="icon"><i class="fab fa-google"></i></span>
                <span class="text">구글로 로그인</span>
            </a>
            <a th:href="@{/oauth2/authorization/kakao}" class="btn-social kakao">
                <span class="icon"><i class="fas fa-comment"></i></span>
                <span class="text">카카오로 로그인</span>
            </a>
            <a th:href="@{/oauth2/authorization/naver}" class="btn-social naver">
                <span class="icon"><strong style="font-size: 1.1em;">N</strong></span>
                <span class="text">네이버로 로그인</span>
            </a>
        </div>

        <div class="find-links">
            <a href="#">아이디 찾기</a> | <a href="#">비밀번호 찾기</a> | <a href="#">회원가입</a>
        </div>
    </div>

    </body>
    </html>
