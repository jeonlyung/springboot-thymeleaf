    <!DOCTYPE html>
    <html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>댕댕이 월드 로그인</title>
        <link rel="stylesheet" th:href="@{/css/login.css}">
    </head>

    <body>
    <div class="login-container">
        <div class="paw-icon">🐾</div>
        <h1>댕댕이 월드</h1>
        <p>로그인하여 댕댕이 친구들을 만나보세요!</p>

        <form th:action="@{/login/process}" method="post">
            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </form>

        <div class="social-login-divider">간편 로그인</div>

        <div class="social-login-circles">
            <a th:href="@{/oauth2/authorization/kakao}" class="circle-btn kakao">
                <img th:src="@{/images/kakao_icon.png}" alt="카카오">
            </a>
            <a th:href="@{/oauth2/authorization/google}" class="circle-btn google">
                <img th:src="@{/images/google_icon.png}" alt="구글">
            </a>
            <a th:href="@{/oauth2/authorization/naver}" class="circle-btn naver">
                <img th:src="@{/images/naver_icon.png}" alt="네이버">
            </a>
        </div>

    </div>
    </body>
    </html>
