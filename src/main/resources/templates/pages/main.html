<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/DefaultLayout}">
<head>
    <meta charset="UTF-8">
    <title>댕댕이 월드 - 메인</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-4xl mx-auto p-8">
        <!-- 환영 메시지 -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        🐾 환영합니다, <span class="text-orange-500" th:text="${username}">사용자</span>님!
                    </h1>
                    <p class="text-gray-600" th:text="${email}">email@example.com</p>
                </div>
                <div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">
                            로그아웃
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 댕댕이 월드 소개 -->
        <div class="bg-gradient-to-r from-orange-100 to-yellow-100 rounded-2xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">🐶 댕댕이 월드에 오신 것을 환영합니다!</h2>
            <p class="text-gray-700 mb-4">
                전국의 댕댕이 집사들과 소통하며 반려견의 일상을 공유하는 따뜻한 커뮤니티입니다.
            </p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="text-3xl mb-2">📝</div>
                    <h3 class="font-bold text-gray-800">게시글 작성</h3>
                    <p class="text-sm text-gray-600">우리 댕댕이 이야기를 들려주세요</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="text-3xl mb-2">💬</div>
                    <h3 class="font-bold text-gray-800">댓글 교류</h3>
                    <p class="text-sm text-gray-600">다른 집사님들과 소통하세요</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="text-3xl mb-2">❤️</div>
                    <h3 class="font-bold text-gray-800">좋아요</h3>
                    <p class="text-sm text-gray-600">사랑스러운 순간에 공감해요</p>
                </div>
            </div>
        </div>

        <!-- 인증 정보 (개발용) -->
        <div class="mt-8 bg-gray-100 rounded-xl p-6" sec:authorize="isAuthenticated()">
            <h3 class="text-lg font-bold text-gray-700 mb-4">🔐 인증 정보 (개발용)</h3>
            <div class="text-sm text-gray-600">
                <p><strong>사용자명:</strong> <span th:text="${username}">-</span></p>
                <p><strong>이메일:</strong> <span th:text="${email}">-</span></p>
                <p><strong>권한:</strong> <span sec:authentication="authorities">-</span></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
