<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">iOS Guide</title>
  <desc id="desc">iOS install steps</desc>
  <rect width="1080" height="760" fill="#ffffff"/>
  <rect x="40" y="40" width="1000" height="680" fill="#eef2ff" stroke="#a5b4fc" stroke-width="4"/>
  <text x="74" y="132" font-size="60" font-weight="700" fill="#1e40af" font-family="Arial, sans-serif">iPhone Install Steps</text>
  <line x1="74" y1="170" x2="1010" y2="170" stroke="#818cf8" stroke-width="3"/>
  <text x="94" y="260" font-size="44" fill="#111827" font-family="Arial, sans-serif">1. Tap download button</text>
  <text x="94" y="340" font-size="44" fill="#111827" font-family="Arial, sans-serif">2. Open Settings profile</text>
  <text x="94" y="420" font-size="44" fill="#111827" font-family="Arial, sans-serif">3. Trust and install app</text>
  <text x="94" y="500" font-size="44" fill="#111827" font-family="Arial, sans-serif">4. Launch DerbyOn</text>
  <rect x="730" y="224" width="240" height="360" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
</svg>

