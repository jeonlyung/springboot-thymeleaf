<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 룰렛</title>
    <th:block layout:fragment="head-extra">
        <link rel="stylesheet" th:href="@{/css/roulette.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content" class="roulette-page">
    <section class="roulette-hero">
        <div class="hero-text">
            <p class="hero-badge">EVENT</p>
            <h1>오늘의 행운 룰렛</h1>
            <p class="hero-desc">버튼을 눌러 룰렛을 돌려보세요. 당첨 결과는 바로 공개됩니다.</p>
        </div>
        <div class="hero-reward">
            <div class="reward-card">
                <p class="reward-title">오늘의 혜택</p>
                <ul class="reward-list">
                    <li>10% 할인 쿠폰</li>
                    <li>무료 배송</li>
                    <li>포인트 적립</li>
                    <li>꽝 없이 랜덤 지급</li>
                </ul>
            </div>
        </div>
    </section>

    <section class="roulette-panel">
        <div class="roulette-stage">
            <div class="roulette-pointer" aria-hidden="true"></div>
            <canvas id="rouletteCanvas" width="420" height="420" aria-label="이벤트 룰렛"></canvas>
        </div>
        <div class="roulette-actions">
            <h2>룰렛 돌리기</h2>
            <p class="roulette-guide">오늘 1회 참여 가능</p>
            <button id="spinButton" class="btn-spin" type="button">룰렛 돌리기</button>
            <button id="resetButton" class="btn-reset" type="button" disabled>다시 돌리기</button>
            <p class="roulette-tip">* 결과는 즉시 확정됩니다.</p>
        </div>
    </section>

    <section class="roulette-notice">
        <h3>참여 유의사항</h3>
        <ul>
            <li>이벤트 기간 내 1일 1회 참여 가능합니다.</li>
            <li>쿠폰은 당첨 즉시 자동 발급됩니다.</li>
            <li>부정 참여는 제재될 수 있습니다.</li>
        </ul>
    </section>

    <div id="resultModal" class="roulette-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-content">
            <p class="modal-badge">축하합니다!</p>
            <h2 id="resultText">당첨 결과</h2>
            <p id="resultDesc" class="modal-desc">당첨 내용을 확인해 주세요.</p>
            <button id="closeModal" class="btn-close" type="button">확인</button>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        /*<![CDATA[*/
        (function() {
            'use strict';

            const rouletteState = {
                items: [
                    { label: "10% 할인 쿠폰", desc: "결제 시 바로 적용됩니다.", color: "#6C5CE7" },
                    { label: "무료 배송", desc: "배송비가 자동으로 면제됩니다.", color: "#00B894" },
                    { label: "5,000 포인트", desc: "포인트가 즉시 적립됩니다.", color: "#0984E3" },
                    { label: "20% 할인 쿠폰", desc: "오늘만 가능한 추가 혜택!", color: "#E17055" },
                    { label: "1,000 포인트", desc: "다음 구매에 사용 가능해요.", color: "#FDCB6E" },
                    { label: "꽝 없이 당첨", desc: "다음 기회에 더 큰 혜택!", color: "#D63031" }
                ],
                spinning: false,
                currentRotation: 0
            };

            const canvas = document.getElementById("rouletteCanvas");
            const ctx = canvas.getContext("2d");
            const size = canvas.width;
            const radius = size / 2;
            const sliceAngle = (Math.PI * 2) / rouletteState.items.length;

            // [수정] 12시 방향이 경계선이 되도록 초기값 설정 (3시 기준 -90도)
            const offset = -Math.PI / 2;
            let currentRotation = offset;

            function drawWheel(rotation = 0) {
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(rotation);

                rouletteState.items.forEach((item, index) => {
                    const startAngle = index * sliceAngle;
                    const endAngle = startAngle + sliceAngle;

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius - 6, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = item.color;
                    ctx.fill();

                    // 텍스트 그리기
                    ctx.save();
                    ctx.rotate(startAngle + sliceAngle / 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "600 16px 'Noto Sans KR', sans-serif";
                    ctx.textAlign = "right";
                    ctx.fillText(item.label, radius - 30, 6);
                    ctx.restore();
                });

                // 중앙 SPIN 버튼
                ctx.beginPath();
                ctx.arc(0, 0, 46, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.restore();

                // 정중앙 SPIN 글자는 회전하지 않도록 별도로 그림
                ctx.save();
                ctx.translate(radius, radius);
                ctx.fillStyle = "#3d3d57";
                ctx.font = "700 14px 'Noto Sans KR', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("SPIN", 0, 5);
                ctx.restore();
            }

            function spin(targetIndex = null) {
                if (rouletteState.spinning) return;

                rouletteState.spinning = true;
                document.getElementById("spinButton").disabled = true;
                document.getElementById("resetButton").disabled = true;

                // 1. 당첨 항목 결정 (없으면 랜덤)
                if (targetIndex === null) {
                    targetIndex = Math.floor(Math.random() * rouletteState.items.length);
                }

                // 2. 한 칸의 각도 (360도 / 항목수)
                const sliceAngle = (Math.PI * 2) / rouletteState.items.length;

                // 3. 목표 각도 계산 (핵심 공식)
                // - (targetIndex * sliceAngle) : 해당 항목의 시작 지점
                // - (sliceAngle / 2) : 해당 항목의 절반(중앙)만큼 더 이동
                // - (Math.PI / 2) : 12시 포인터 위치 보정 (90도)
                const overlapAngle = (targetIndex * sliceAngle) + (sliceAngle / 2);
                const targetAngle = (Math.PI * 2) - overlapAngle + (Math.PI / 2);

                // 4. 자연스러운 회전을 위해 최소 5바퀴 이상 더 돌리기
                // 현재 회전값(currentRotation)의 기준을 잡고 그 위에 목표 각도를 더함
                const baseRotation = Math.ceil(currentRotation / (Math.PI * 2)) * (Math.PI * 2);
                const extraRotations = (Math.PI * 2) * 5;
                const finalTargetAngle = baseRotation + extraRotations + (targetAngle % (Math.PI * 2));

                const duration = 4500; // 4.5초 동안 회전
                const startTime = performance.now();
                const startRotation = currentRotation;

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // 부드럽게 멈추는 이징 (Quartic Out)
                    const eased = 1 - Math.pow(1 - progress, 4);
                    currentRotation = startRotation + (finalTargetAngle - startRotation) * eased;

                    drawWheel(currentRotation);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        rouletteState.spinning = false;
                        showResult(targetIndex);
                        document.getElementById("spinButton").disabled = false;
                        document.getElementById("resetButton").disabled = false;
                    }
                }
                requestAnimationFrame(animate);
            }

            function showResult(index) {
                const item = rouletteState.items[index];
                const modal = document.getElementById("resultModal");
                const resultText = document.getElementById("resultText");
                const resultDesc = document.getElementById("resultDesc");

                resultText.textContent = item.label;
                resultDesc.textContent = item.desc;
                modal.style.display = "flex";
                modal.setAttribute("aria-hidden", "false");
            }

            function resetRoulette() {
                if (rouletteState.spinning) return;

                currentRotation = offset;
                drawWheel(currentRotation);
                document.getElementById("spinButton").disabled = false;
                document.getElementById("resetButton").disabled = true;
            }

            // 초기 실행
            drawWheel(currentRotation);

            // 이벤트 리스너
            const spinButton = document.getElementById("spinButton");
            const resetButton = document.getElementById("resetButton");
            const closeModal = document.getElementById("closeModal");
            const resultModal = document.getElementById("resultModal");

            // 스핀 버튼 클릭
            spinButton.addEventListener("click", () => spin());

            // 리셋 버튼 클릭
            resetButton.addEventListener("click", resetRoulette);

            // 모달 닫기
            closeModal.addEventListener("click", () => {
                resultModal.style.display = "none";
                resultModal.setAttribute("aria-hidden", "true");
            });

            // 모달 배경 클릭 시 닫기
            resultModal.addEventListener("click", (e) => {
                if (e.target === resultModal) {
                    resultModal.style.display = "none";
                    resultModal.setAttribute("aria-hidden", "true");
                }
            });

            // 캔버스 중앙 버튼 클릭
            canvas.addEventListener("click", (event) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (event.clientX - rect.left) * scaleX - radius;
                const y = (event.clientY - rect.top) * scaleY - radius;
                const distance = Math.sqrt(x * x + y * y);

                if (distance <= 46 && !rouletteState.spinning) {
                    spin();
                }
            });

            // 마우스 커서 변경
            canvas.addEventListener("mousemove", (event) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (event.clientX - rect.left) * scaleX - radius;
                const y = (event.clientY - rect.top) * scaleY - radius;
                const distance = Math.sqrt(x * x + y * y);

                canvas.style.cursor = (distance <= 46 && !rouletteState.spinning) ? "pointer" : "default";
            });

            // 콘솔에서 테스트 가능하도록 노출
            window.rouletteSpin = function(index) {
                spin(index);
            };
            window.rouletteReset = resetRoulette;
        })();
        /*]]>*/
    </script>

</th:block>
</body>
</html>
