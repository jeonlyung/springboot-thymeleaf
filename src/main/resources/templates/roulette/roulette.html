<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 룰렛</title>
    <style>
        /* ── 공통 변수 ── */
        :root {
            --btn-border:     1px solid rgba(255, 255, 255, 0.28);
            --btn-inset:      inset 0 1px 0 rgba(255, 255, 255, 0.62);
            --btn-radius:     999px;
            --btn-transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            --shadow-text:    0 2px 10px rgba(0, 0, 0, 0.40), 0 0 8px rgba(0, 0, 0, 0.30);
        }

        /* ── 리셋 ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; background: #0677bc; color: #fff; }

        /* ── 레이아웃 ── */
        .roulette-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            isolation: isolate;
            background: #0677bc;
        }

        .poster {
            z-index: 1;
            position: relative;
            width: min(100%, 430px);
            min-height: 100vh;
            border-radius: 26px;
            padding: max(16px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)) 18px;
            overflow: hidden auto;
            background: #0880b8 url('/images/roulette/roulette-event.png') center top / cover no-repeat scroll;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 22px 45px rgba(0, 0, 0, 0.28);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* poster 장식 원 - 공통 */
        .poster::before, .poster::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            opacity: 0.35;
        }
        .poster::before { width: 260px; height: 260px; left: -110px; top: 60%;  background: radial-gradient(circle, #a7f1ff 0%, rgba(167, 241, 255, 0) 72%); }
        .poster::after  { width: 210px; height: 210px; right: -84px; top: 6%;   background: radial-gradient(circle, #ffe37b 0%, rgba(255, 227, 123, 0) 72%); }

        /* ── 히어로 텍스트 ── */
        .hero { z-index: 2; text-align: center; margin-top: 6px; }

        /* 공통: 노란색 계열 */
        .hero-kicker, .hero-title { color: #ffff00; font-weight: 900; }
        /* 공통: 흰색 + 어두운 그림자 */
        .hero-sub, .hero-period   { color: #ffffff; text-shadow: var(--shadow-text); }

        .hero-kicker { font-size: 1.9rem;  line-height: 1.05; letter-spacing: -0.04em; text-shadow: 0 2px 10px rgba(0,0,0,.40), 0 0 14px rgba(255,255,0,.50); }
        .hero-sub    { margin-top: 2px;    font-weight: 900; font-size: 1.95rem; line-height: 1.08; letter-spacing: -0.05em; }
        .hero-title  { margin-top: 2px;    font-size: 2.2rem; line-height: 1.0; letter-spacing: -0.06em; text-shadow: 0 3px 0 rgba(0,0,0,.40), 0 0 22px rgba(255,255,0,.50); word-break: keep-all; overflow-wrap: break-word; }
        .hero-period { margin-top: 16px;   font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }

        /* ── 룰렛 ── */
        .roulette-panel, .join-wrap { z-index: 2; width: 100%; }

        .roulette-panel { position: relative; margin-top: 27px; display: flex; justify-content: center; }

        .roulette-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 390px;
            padding: 10px;
            border-radius: 50%;
            background: linear-gradient(180deg, #f7ffff 0%, #eaf6ff 100%);
            box-shadow: 0 16px 26px rgba(0, 53, 92, 0.35);
        }

        /* 포인터 - 공통 pseudo */
        .roulette-pointer { position: absolute; top: -22px; left: 50%; width: 34px; height: 34px; transform: translateX(-50%); z-index: 5; filter: drop-shadow(0 8px 10px rgba(255, 110, 61, 0.32)); }
        .roulette-pointer::before, .roulette-pointer::after { content: ""; position: absolute; }
        .roulette-pointer::before { inset: 0; background: linear-gradient(180deg, #ff6f4a 0%, #ff4f2e 100%); border-radius: 55% 55% 55% 0; transform: rotate(-45deg); transform-origin: center; }
        .roulette-pointer::after  { top: 10px; left: 50%; width: 14px; height: 14px; background: #fffdf7; border-radius: 50%; transform: translateX(-50%); box-shadow: 0 1px 3px rgba(0,0,0,.10); }

        #rouletteCanvas { width: 344px; height: 344px; border-radius: 50%; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

        /* ── 버튼 영역 ── */
        .join-wrap       { margin-top: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .button-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: min(100%, 260px); }

        /* 버튼 공통 */
        .btn-join, .btn-raffle {
            border: var(--btn-border);
            border-radius: var(--btn-radius);
            width: 100%;
            min-width: 140px;
            padding: 12px 24px;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #fff;
            cursor: pointer;
            transition: var(--btn-transition);
        }
        .btn-join   { background: linear-gradient(135deg, #ff6b9d 0%, #ffa366 45%, #ffc857 100%); box-shadow: 0 12px 24px rgba(255,107,157,.40), var(--btn-inset); }
        .btn-raffle { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);              box-shadow: 0 12px 24px rgba(102,126,234,.40), var(--btn-inset); }
        .btn-join:disabled,
        .btn-raffle:disabled { cursor: not-allowed; opacity: 0.72; filter: saturate(0.75); }

        /* ── 모달 ── */
        .roulette-modal { position: fixed; inset: 0; background: rgba(15,15,24,.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 999; }
        .modal-content  { background: #fff; border-radius: 16px; padding: 24px 20px; text-align: center; max-width: 280px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,.3); }
        .modal-content h2 { color: #3d3d57; font-size: 1.3rem; margin: 8px 0; }
        .modal-badge    { display: inline-block; background: linear-gradient(135deg, rgba(255,122,89,.2) 0%, rgba(255,122,89,.1) 100%); color: #ff7a59; padding: 6px 12px; border-radius: var(--btn-radius); font-weight: 700; font-size: 0.85rem; }
        .modal-desc     { color: #60607a; margin: 8px 0 16px; font-size: 0.9rem; }
        .btn-close      { width: 100%; padding: 12px 16px; font-size: 0.95rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; background: linear-gradient(135deg, #5b46f6 0%, #7c5dfa 100%); color: #fff; box-shadow: 0 6px 20px rgba(91,70,246,.4); }

        /* ── 유의사항 ── */
        .notice-card  { position: relative; z-index: 2; width: min(100%, 360px); margin-top: 20px; padding: 16px 18px; border-radius: 18px; background: rgba(2,64,111,.48); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 24px rgba(0,38,71,.18); backdrop-filter: blur(10px); }
        .notice-title { font-size: 1rem; font-weight: 900; color: #fff9e0; letter-spacing: -0.03em; text-shadow: 0 1px 4px rgba(0,0,0,.30); }
        .notice-list  { margin-top: 10px; color: #fffaf0; font-size: 0.94rem; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,.20); }
        .notice-list ul { margin: 0; padding-left: 18px; }
        .notice-list li + li { margin-top: 6px; }

        /* ── 미디어쿼리: 태블릿 768~1180px ── */
        @media (min-width: 768px) and (max-width: 1180px) {
            .roulette-page { padding: 24px; }
            .poster        { width: min(100%, 500px); }
        }

        /* ── 미디어쿼리: 모바일 ~430px ── */
        @media (max-width: 430px) {
            .roulette-page { min-height: 100svh; padding: 0; }
            .poster        { min-height: 100svh; border-radius: 0; width: 100%; padding: max(16px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)) 14px; }
            .notice-card   { width: 100%; padding: 15px 16px; border-radius: 16px; }
        }

        /* ── 미디어쿼리: 소형 모바일 ~380px ── */
        @media (max-width: 380px) {
            .hero-kicker, .hero-sub { font-size: 1.6rem; }
            .hero-title   { font-size: 1.9rem; }
            .hero-period  { font-size: 1.45rem; }
            .roulette-panel { margin-top: 27px; }
            .roulette-stage { max-width: 330px; padding: 16px; }
            #rouletteCanvas { width: 292px; height: 292px; }
            .btn-join     { font-size: 1.56rem; }
            .notice-title { font-size: 0.96rem; }
            .notice-list  { font-size: 0.88rem; line-height: 1.55; }
        }

        /* ── 미디어쿼리: 초소형 모바일 ~320px ── */
        @media (max-width: 320px) {
            #rouletteCanvas { width: 260px; height: 260px; }
            .roulette-stage { max-width: 290px; padding: 14px; }
            .hero-title     { font-size: 1.7rem; }
        }

        /* ── 미디어쿼리: 랩탑/데스크탑 431px+ ── */
        @media (min-width: 431px) {
            .roulette-page { height: 100dvh; }
            .poster        { min-height: 0; }
        }

        /* 높이 900px 이하 (MacBook 13" 등) */
        @media (min-width: 431px) and (max-height: 900px) {
            .hero            { margin-top: 4px; }
            .hero-kicker     { font-size: 1.55rem; }
            .hero-sub        { font-size: 1.6rem; }
            .hero-title      { font-size: 1.85rem; }
            .hero-period     { font-size: 1.5rem; margin-top: 10px; }
            .roulette-panel  { margin-top: 16px; }
            .roulette-stage  { max-width: 320px; padding: 8px; }
            #rouletteCanvas  { width: 278px; height: 278px; }
            .join-wrap       { margin-top: 14px; gap: 8px; }
            .btn-join,
            .btn-raffle      { font-size: 1.3rem; padding: 10px 22px; }
            .notice-card     { margin-top: 12px; padding: 12px 16px; }
            .notice-title    { font-size: 0.92rem; }
            .notice-list     { font-size: 0.85rem; }
        }

        /* 높이 768px 이하 (1366×768 Windows 등) */
        @media (min-width: 431px) and (max-height: 768px) {
            .hero            { margin-top: 2px; }
            .hero-kicker     { font-size: 1.3rem; }
            .hero-sub        { font-size: 1.35rem; }
            .hero-title      { font-size: 1.55rem; }
            .hero-period     { font-size: 1.25rem; margin-top: 5px; }
            .roulette-panel  { margin-top: 10px; }
            .roulette-stage  { max-width: 286px; padding: 7px; }
            #rouletteCanvas  { width: 238px; height: 238px; }
            .join-wrap       { margin-top: 10px; gap: 6px; }
            .btn-join,
            .btn-raffle      { font-size: 1.1rem; padding: 9px 18px; }

            .notice-card     { margin-top: 8px; padding: 10px 14px; }
            .notice-title    { font-size: 0.88rem; }
            .notice-list     { font-size: 0.82rem; line-height: 1.45; }
        }
    </style>
</head>
<body>
<div class="roulette-page">
    <main class="poster">
        <header class="hero" aria-label="이벤트 안내">
            <p class="hero-kicker">돌려라!</p>
            <p class="hero-sub">행운이 쏟아지는</p>
            <h1 id="eventTitle" class="hero-title">룰렛이벤트</h1>
            <p id="eventPeriod" class="hero-period">기간 : 2026.4.1 ~ 4.31</p>
        </header>

        <section class="roulette-panel">
            <div class="roulette-stage">
                <div class="roulette-pointer" aria-hidden="true"></div>
                <canvas id="rouletteCanvas" width="344" height="344" aria-label="이벤트 룰렛"></canvas>
            </div>
        </section>

        <div class="join-wrap">
            <div class="button-container">
                <button id="joinButton" class="btn-join" type="button">참여가능</button>
                <button id="raffleButton" class="btn-raffle" type="button">응모권 참여</button>
            </div>
        </div>

        <section class="notice-card" aria-label="참여 유의사항">
            <h2 class="notice-title">참여 유의사항</h2>
            <div id="noticeContents" class="notice-list">
                <ul>
                    <li>본 이벤트는 계정당 1일 1회만 참여할 수 있습니다.</li>
                    <li>당첨 혜택은 참여 즉시 지급되며, 일부 쿠폰은 사용 기한이 적용됩니다.</li>
                    <li>비정상적인 참여가 확인될 경우 당첨이 취소될 수 있습니다.</li>
                </ul>
            </div>
        </section>
    </main>

    <div id="resultModal" class="roulette-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-content">
            <p class="modal-badge">축하합니다!</p>
            <h2 id="resultText">당첨 결과</h2>
            <p id="resultDesc" class="modal-desc">당첨 내용을 확인해 주세요.</p>
            <button id="closeModal" class="btn-close" type="button">확인</button>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        /*
         * =====================================================================
         * 인터페이스 설계서 기반 API 규격
         * =====================================================================
         *
         * [IF-CX-047] 이벤트 정보 조회
         *   POST /api/v1/evm/ec-event-list
         *   Response: { resultCode, resultMsg,
         *     resultData: { isSuccess, errMsg,
         *       ecEventList: [{ eventId, eventName, eventStartDate, eventEndDate, ... }] } }
         *
         * [IF-CX-049] 이벤트 혜택 구성 정보 조회
         *   POST /api/v1/evm/ec-event-prize-list
         *   Request:  { eventId }
         *   Response: { resultCode, resultMsg,
         *     resultData: { isSuccess, errMsg,
         *       ecEventPrizeList: [{ couponName, ... }] } }
         *
         * [IF-CX-050] 응모권 횟수 조회
         *   POST /api/roulette/raffle-info
         *   Request:  { eventId, acntNo }
         *   Response: { resultCode, resultMsg,
         *     resultData: { isSuccess, errMsg,
         *       ecEventRaffleInfo: [{ raffleTicketCount }] } }
         *
         * [IF-CX-051] 당첨자 선정 (스핀)
         *   POST /api/roulette/draw
         *   Request:  { eventId, acntNo }
         *   Response: { resultCode, resultMsg,
         *     resultData: { isSuccess, errMsg,
         *       ecEventDraw: [{ isWinning, winningCouponName }] } }
         *   isWinning: "1" = 당첨, "0" = 꽝
         *
         * [IF-CX-052] 이벤트 신청대상 확인
         *   POST /api/roulette/target-check
         *   Request:  { eventId, acntNo }
         *   Response: { resultCode, resultMsg,
         *     resultData: { isSuccess, errMsg,
         *       ecEventTargetCheck: [{ isTarget, targetCouponName }] } }
         *   isTarget: "1" = 대상, "0" = 미대상
         * =====================================================================
         */

        const API_CONFIG = {
            // API 활성화 여부 (false 시 스텁 모드로 동작)
            enabled: true,
            // 아래 두 값은 /api/roulette/init 으로 서버에서 주입됩니다 (JS 하드코딩 금지)
            eventId: null,
            acntNo: null,
            initUrl: '/api/roulette/init',
            eventListUrl: '/api/v1/evm/ec-event-list',
            prizeListUrl: '/api/v1/evm/ec-event-prize-list',
            raffleInfoUrl: '/api/roulette/raffle-info',
            drawUrl: '/api/roulette/draw',
            targetCheckUrl: '/api/roulette/target-check'
        };

        // 룰렛 항목 - 서버 IF-CX-049 응답으로 채워집니다 (초기 하드코딩 없음)
        const rouletteState = {
            items: [],
            spinning: false,
            currentRotation: -Math.PI / 2,
            requestPending: false,
            availableTicketCount: 0,
            restoreStatusOnModalClose: false
        };

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const size = 344; // CSS와 일치
        const radius = size / 2;

        const closeModal = document.getElementById('closeModal');
        const resultModal = document.getElementById('resultModal');
        const joinButton = document.getElementById('joinButton');
        const raffleButton = document.getElementById('raffleButton');
        const noticeContents = document.getElementById('noticeContents');
        const apiStatus = document.getElementById('apiStatus');
        const eventTitle = document.getElementById('eventTitle');
        const eventPeriod = document.getElementById('eventPeriod');

        // 한 바퀴(360도)
        const fullRotation = Math.PI * 2;
        // 12시 방향 포인터 각도(3시 기준 -90도)
        const pointerAngle = -Math.PI / 2;

        // 항목 수에 맞는 한 칸의 회전 각도를 계산합니다.
        function getSliceAngle() {
            return (Math.PI * 2) / rouletteState.items.length;
        }

        // 각도를 0~2PI 범위로 정규화합니다.
        function normalizeAngle(angle) {
            return ((angle % fullRotation) + fullRotation) % fullRotation;
        }

        // 현재 회전값 기준으로 포인터가 가리키는 항목 인덱스를 구합니다.
        function getLandedIndex(rotation) {
            const relativeAngle = normalizeAngle(pointerAngle - rotation);
            return Math.floor(relativeAngle / getSliceAngle()) % rouletteState.items.length;
        }

        // 하단 상태 영역에 API 진행/오류 메시지를 표시합니다.
        function setApiStatus(message, isError) {
            if (!apiStatus) { return; }
            apiStatus.textContent = message || '';
            apiStatus.style.color = isError ? '#ffe5e5' : '#f2fbff';
        }

        // 보유 응모권 수를 저장합니다.
        function setAvailableTicketCount(ticketCount) {
            rouletteState.availableTicketCount = Math.max(0, Number(ticketCount) || 0);
            if (!rouletteState.requestPending && !rouletteState.spinning) {
                joinButton.disabled = rouletteState.availableTicketCount <= 0;
            }
            restoreJoinButtonLabel();
        }

        // 참여 버튼 문구를 현재 보유 응모권 수 기준으로 복원합니다.
        function restoreJoinButtonLabel() {
            if (rouletteState.availableTicketCount > 0) {
                joinButton.textContent = rouletteState.availableTicketCount + '회 참여가능';
            } else {
                joinButton.textContent = '응모권 소진';
            }
        }

        // 항목 인덱스에 맞는 색상을 팔레트에서 반환합니다.
        function pickColor(index) {
            const palette = ['#7B72E8', '#31C6AB', '#43A1EA', '#E78A6D', '#E6C56F', '#DA5F66', '#5B8CEE', '#F06595'];
            return palette[index % palette.length];
        }

        // 쿠폰명으로 룰렛 항목 인덱스를 찾습니다. 없으면 null을 반환합니다.
        function findItemIndexByCouponName(couponName) {
            if (!couponName) { return null; }
            const lower = couponName.trim().toLowerCase();
            const idx = rouletteState.items.findIndex(function(item) {
                return item.label.trim().toLowerCase() === lower;
            });
            return idx >= 0 ? idx : null;
        }

        // 참여 버튼의 로딩 상태와 문구를 제어합니다.
        function setJoinButtonLoading(isLoading, label) {
            rouletteState.requestPending = isLoading;
            if (isLoading) {
                joinButton.disabled = true;
                joinButton.textContent = label || '서버 통신중...';
                return;
            }
            joinButton.disabled = rouletteState.spinning || rouletteState.availableTicketCount <= 0;
            if (label) {
                joinButton.textContent = label;
                return;
            }
            restoreJoinButtonLabel();
        }

        // 공통 안내/결과 모달을 엽니다.
        function openModal(badgeText, titleText, descText) {
            const modalBadge = document.querySelector('.modal-badge');
            const resultText = document.getElementById('resultText');
            const resultDesc = document.getElementById('resultDesc');

            modalBadge.textContent = badgeText || '안내';
            if (titleText) {
                resultText.textContent = titleText;
                resultText.style.display = 'block';
            } else {
                resultText.textContent = '';
                resultText.style.display = 'none';
            }
            resultDesc.textContent = descText || '내용을 확인해 주세요.';
            resultModal.style.display = 'flex';
            resultModal.setAttribute('aria-hidden', 'false');
        }

        // 공통 모달을 닫습니다.
        function closeResultModal() {
            resultModal.style.display = 'none';
            resultModal.setAttribute('aria-hidden', 'true');
            if (rouletteState.restoreStatusOnModalClose) {
                setApiStatus('');
                restoreJoinButtonLabel();
            }
            rouletteState.restoreStatusOnModalClose = false;
        }

        // CSRF 메타 태그가 있으면 요청 헤더로 변환합니다.
        function getCsrfHeaders() {
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (!tokenMeta || !headerMeta) { return {}; }
            return { [headerMeta.content]: tokenMeta.content };
        }

        // 공통 fetch 래퍼 - JSON 요청/응답 처리
        async function requestJson(url, options) {
            const response = await fetch(url, {
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    ...getCsrfHeaders(),
                    ...(options && options.headers ? options.headers : {})
                },
                ...options
            });
            if (!response.ok) { throw new Error('HTTP ' + response.status); }
            const ct = response.headers.get('content-type') || '';
            return ct.includes('application/json') ? response.json() : null;
        }

        // IF-CX-052 이벤트 신청대상 확인: "0" 미대상, "1" 대상
        async function checkTargetAndGetTicket() {
            if (!API_CONFIG.enabled) {
                return { isTarget: true, raffleTicketCount: 3 };
            }
            // 대상 확인 (IF-CX-052)
            const targetRes = await requestJson(API_CONFIG.targetCheckUrl, {
                method: 'POST',
                body: JSON.stringify({ eventId: API_CONFIG.eventId, acntNo: API_CONFIG.acntNo })
            });
            const targetData = targetRes && targetRes.resultData && targetRes.resultData.ecEventTargetCheck;
            const isTarget = targetData && targetData[0] && targetData[0].isTarget === '1';
            if (!isTarget) { return { isTarget: false, raffleTicketCount: 0 }; }

            // 응모권 조회 (IF-CX-050)
            const raffleRes = await requestJson(API_CONFIG.raffleInfoUrl, {
                method: 'POST',
                body: JSON.stringify({ eventId: API_CONFIG.eventId, acntNo: API_CONFIG.acntNo })
            });
            const raffleData = raffleRes && raffleRes.resultData && raffleRes.resultData.ecEventRaffleInfo;
            const count = raffleData && raffleData[0] ? raffleData[0].raffleTicketCount : 0;
            return { isTarget: true, raffleTicketCount: count };
        }

        // IF-CX-051 당첨자 선정: isWinning "1"=당첨 "0"=꽝
        async function requestDrawResult() {
            if (!API_CONFIG.enabled) {
                // 스텁: 랜덤 당첨 시뮬레이션
                const labels = rouletteState.items.map(function(i) { return i.label; });
                const picked = labels[Math.floor(Math.random() * labels.length)];
                return { isWinning: '1', winningCouponName: picked };
            }
            const res = await requestJson(API_CONFIG.drawUrl, {
                method: 'POST',
                body: JSON.stringify({ eventId: API_CONFIG.eventId, acntNo: API_CONFIG.acntNo })
            });
            if (!res || !res.resultData || !res.resultData.isSuccess) {
                throw new Error(res && res.resultData ? res.resultData.errMsg : '서버 오류');
            }
            const draw = res.resultData.ecEventDraw;
            return draw && draw[0] ? draw[0] : { isWinning: '0', winningCouponName: null };
        }

        // API 배열 응답을 안전하게 읽기 위한 헬퍼입니다.
        function ensureArray(value) {
            return Array.isArray(value) ? value : [];
        }

        // resultData.isSuccess 표기가 boolean/string 어느 쪽이든 성공 여부를 판정합니다.
        function isApiSuccess(res) {
            const success = res && res.resultData ? res.resultData.isSuccess : false;
            return success === true || success === 'true' || success === '1';
        }

        // YYYYMMDD를 YYYY.M.D 형태로 변환합니다.
        function formatYmd(value) {
            const raw = String(value || '');
            if (!/^\d{8}$/.test(raw)) { return raw; }
            const y = raw.slice(0, 4);
            const m = String(Number(raw.slice(4, 6)));
            const d = String(Number(raw.slice(6, 8)));
            return y + '.' + m + '.' + d;
        }

        // 오늘 날짜를 YYYYMMDD 문자열로 반환합니다.
        function getTodayYmd() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return '' + y + m + d;
        }

        // 이벤트 기간 문자열을 화면 표시용으로 변환합니다.
        function formatEventPeriod(startDate, endDate) {
            const start = formatYmd(startDate);
            const end = formatYmd(endDate);
            if (!start && !end) { return ''; }
            if (start && end) { return start + ' ~ ' + end; }
            return start || end;
        }

        // 목록에서 오늘 기준 진행중 이벤트를 우선 선택합니다.
        function pickCurrentEvent(eventList) {
            const today = getTodayYmd();
            const current = eventList.find(function(event) {
                const start = String(event && event.eventStartDate ? event.eventStartDate : '');
                const end = String(event && event.eventEndDate ? event.eventEndDate : '');
                return /^\d{8}$/.test(start) && /^\d{8}$/.test(end) && start <= today && today <= end;
            });
            return current || eventList[0] || null;
        }

        // eventId에 해당하는 이벤트명/기간을 상단 타이틀에 반영합니다.
        function applyEventMeta(eventInfo) {
            if (!eventInfo) { return; }
            if (eventTitle && eventInfo.eventName) {
                eventTitle.textContent = eventInfo.eventName;
            }
            if (eventPeriod) {
                const period = formatEventPeriod(eventInfo.eventStartDate, eventInfo.eventEndDate);
                if (period) {
                    eventPeriod.textContent = '기간 : ' + period;
                }
            }
        }

        // 이벤트의 유의사항 HTML(dispContents)을 카드 영역에 반영합니다.
        function applyNoticeContents(dispContents) {
            if (!noticeContents) { return; }
            const html = typeof dispContents === 'string' ? dispContents.trim() : '';
            if (!html) { return; } // 값이 없으면 템플릿 기본 안내문 유지
            noticeContents.innerHTML = html;
        }

        // 쿠폰명이 콤마로 내려올 수 있어 룰렛 표시용 문자열 배열로 정규화합니다.
        // 단, "5,000" 처럼 콤마 뒤에 숫자가 오는 천단위 구분자는 분리하지 않습니다.
        function parseCouponNames(value) {
            return String(value || '')
                .split(/,(?!\d)/)   // 콤마 뒤가 숫자(천단위)면 분리 안 함
                .map(function(name) { return name.trim(); })
                .filter(function(name) { return name.length > 0; });
        }

        // IF-CX-047/049를 순차 호출해 eventId와 룰렛 항목을 동기화합니다.
        async function loadEventDefinitions() {
            if (!API_CONFIG.enabled) {
                return;
            }

            try {
                setApiStatus('이벤트 목록 조회 중...');
                const eventRes = await requestJson(API_CONFIG.eventListUrl, {
                    method: 'POST',
                    body: JSON.stringify({})
                });
                if (!isApiSuccess(eventRes)) {
                    throw new Error('이벤트 목록 조회 실패');
                }

                const eventList = ensureArray(eventRes.resultData.ecEventList);
                const selectedEvent = pickCurrentEvent(eventList);
                if (!selectedEvent) {
                    throw new Error('조회 가능한 이벤트가 없습니다.');
                }

                const selectedEventId = Number(selectedEvent.eventId);
                if (Number.isFinite(selectedEventId)) {
                    API_CONFIG.eventId = selectedEventId;
                }
                applyEventMeta(selectedEvent);
                applyNoticeContents(selectedEvent && selectedEvent.dispContents);

                setApiStatus('이벤트 항목 조회 중...');
                const prizeRes = await requestJson(API_CONFIG.prizeListUrl, {
                    method: 'POST',
                    body: JSON.stringify({ eventId: API_CONFIG.eventId })
                });
                if (!isApiSuccess(prizeRes)) {
                    throw new Error('이벤트 항목 조회 실패');
                }

                const prizeList = ensureArray(prizeRes.resultData.ecEventPrizeList);
                const mappedItems = [];

                prizeList.forEach(function(prize, index) {
                    parseCouponNames(prize && prize.couponName).forEach(function(couponName, splitIndex) {
                        mappedItems.push({
                            id: 'prize_' + index + '_' + splitIndex,
                            label: couponName,
                            desc: '당첨 혜택이 지급됩니다.',
                            color: pickColor(mappedItems.length)
                        });
                    });
                });

                if (mappedItems.length >= 2) {
                    rouletteState.items = mappedItems;
                } else if (mappedItems.length === 1) {
                    rouletteState.items = mappedItems.concat([
                        { id: 'miss', label: '다음 기회', desc: '다음 기회에 더 큰 혜택!', color: '#DA5F66' }
                    ]);
                }
            } catch (err) {
                setApiStatus('이벤트 목록/항목 조회 실패: 기본 항목으로 진행합니다.', true);
                console.warn('[roulette] loadEventDefinitions failed', err);
            }
        }

        // 초기화 시 대상 여부 및 응모권 수를 확인합니다.
        async function loadRaffleStatus() {
            try {
                setApiStatus('이벤트 정보를 확인하는 중...');
                const result = await checkTargetAndGetTicket();
                if (!result.isTarget) {
                    setApiStatus('이벤트 참여 대상이 아닙니다.', true);
                    joinButton.disabled = true;
                    joinButton.textContent = '참여 불가';
                    raffleButton.disabled = true;
                    raffleButton.textContent = '참여 불가';
                    return;
                }
                if (result.raffleTicketCount <= 0) {
                    setApiStatus('응모권이 없습니다.', true);
                    joinButton.disabled = true;
                    joinButton.textContent = '응모권 소진';
                    raffleButton.disabled = true;
                    raffleButton.textContent = '응모권 소진';
                    return;
                }
                setAvailableTicketCount(result.raffleTicketCount);
                setApiStatus('');
                joinButton.disabled = false;
                restoreJoinButtonLabel();
                raffleButton.disabled = false;
                raffleButton.textContent = '응모권 참여';
            } catch (err) {
                setApiStatus('이벤트 확인 실패: 기본 모드로 진행합니다.', true);
                console.warn('[roulette] loadRaffleStatus failed', err);
            }
        }

        // 현재 상태를 기반으로 룰렛 캔버스를 다시 그립니다.
        function drawWheel(rotation) {
            const safeRotation = typeof rotation === 'number' ? rotation : rouletteState.currentRotation;

            ctx.clearRect(0, 0, size, size);

            // 항목이 없으면 로딩 상태를 표시합니다.
            if (rouletteState.items.length === 0) {
                ctx.save();
                ctx.translate(radius, radius);
                ctx.beginPath();
                ctx.arc(0, 0, radius - 6, 0, Math.PI * 2);
                ctx.fillStyle = '#cce8f4';
                ctx.fill();
                ctx.fillStyle = '#2B7EEA';
                ctx.font = '700 16px -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('로딩 중...', 0, 7);
                ctx.restore();
                return;
            }

            const sliceAngle = getSliceAngle();
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(safeRotation);

            // 라벨 길이 기준으로 방사형 텍스트 폰트 크기 계산
            // 7개 항목 기준 최적화 (폰트: 9~13px, 위치: radius-30)
            const maxLabelLen = Math.max(...rouletteState.items.map(function(i) { return i.label.length; }));
            const fontSize = Math.max(14, Math.min(13, Math.floor(104 / Math.max(maxLabelLen, 4))));

            rouletteState.items.forEach((item, index) => {
                const startAngle = index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 6, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();

                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.shadowColor = 'rgba(0, 30, 50, 0.60)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 1;
                ctx.fillStyle = '#ffffff';
                ctx.font = '700 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(item.label, radius - 30, Math.floor(fontSize / 2.4));
                ctx.restore();
            });

            const hubGrad = ctx.createRadialGradient(radius, radius, 6, radius, radius, 46);
            hubGrad.addColorStop(0, '#ffe37b');
            hubGrad.addColorStop(0.55, '#ffc107');
            hubGrad.addColorStop(1, '#e65100');

            ctx.beginPath();
            ctx.arc(0, 0, 46, 0, Math.PI * 2);
            ctx.restore();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.beginPath();
            ctx.arc(0, 0, 46, 0, Math.PI * 2);
            ctx.fillStyle = hubGrad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.shadowColor = 'rgba(0,0,0,0.35)';
            ctx.shadowBlur = 3;
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 20px -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('시작', 0, 7);
            ctx.restore();
        }

        // POST /api/roulette/init - 서버에서 acntNo / eventId 를 가져옵니다.
        async function initPageConfig() {
            if (!API_CONFIG.enabled) {
                API_CONFIG.acntNo = '0000000000';
                API_CONFIG.eventId = 1;
                return;
            }
            try {
                setApiStatus('사용자 정보 확인 중...');
                const res = await requestJson(API_CONFIG.initUrl, {
                    method: 'POST',
                    body: JSON.stringify({})
                });
                if (res && res.acntNo) {
                    API_CONFIG.acntNo  = res.acntNo;
                }
                if (res && res.eventId) {
                    API_CONFIG.eventId = res.eventId;
                }
            } catch (err) {
                setApiStatus('초기화 실패: 기본값으로 진행합니다.', true);
                console.warn('[roulette] initPageConfig failed', err);
                // 서버 장애 시 fallback (절대 JS 하드코딩 노출 금지 — 빈값 유지)
            }
        }

        // 목표 인덱스까지 감속 애니메이션으로 룰렛을 회전시킵니다.
        function spin(targetIndex, drawResult) {
            if (rouletteState.spinning || rouletteState.items.length < 2) {
                return;
            }

            let safeTargetIndex = targetIndex;
            if (!Number.isInteger(safeTargetIndex) || safeTargetIndex < 0 || safeTargetIndex >= rouletteState.items.length) {
                safeTargetIndex = Math.floor(Math.random() * rouletteState.items.length);
            }

            rouletteState.spinning = true;
            joinButton.disabled = true;

            const sliceAngle = getSliceAngle();
            const targetCenterAngle = pointerAngle - ((safeTargetIndex + 0.5) * sliceAngle);
            const currentWrapped = normalizeAngle(rouletteState.currentRotation);
            const targetWrapped = normalizeAngle(targetCenterAngle);
            const delta = (targetWrapped - currentWrapped + fullRotation) % fullRotation;
            const finalTargetAngle = rouletteState.currentRotation + (fullRotation * 3) + delta;

            const duration = 4500;
            const startTime = performance.now();
            const startRotation = rouletteState.currentRotation;

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const eased = 1 - Math.pow(1 - progress, 4);
                rouletteState.currentRotation = startRotation + (finalTargetAngle - startRotation) * eased;

                drawWheel(rouletteState.currentRotation);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    rouletteState.spinning = false;
                    joinButton.disabled = false;
                    const landedIndex = getLandedIndex(rouletteState.currentRotation);
                    showResult(landedIndex, drawResult);
                }
            }

            requestAnimationFrame(animate);
        }

        // 당첨 결과 모달에 당첨 여부 및 쿠폰명을 표시합니다.
        function showResult(index, drawResult) {
            const item = rouletteState.items[index];

            const isWin = drawResult && drawResult.isWinning === '1';
            const couponName = drawResult && drawResult.winningCouponName;
            rouletteState.restoreStatusOnModalClose = true;

            if (isWin && couponName) {
                openModal('🎉 축하합니다!', couponName, item ? item.desc : '당첨 쿠폰이 발급되었습니다.');
            } else if (!isWin) {
                openModal('아쉽게도...', '꽝!', '다음 기회에 더 큰 혜택이 기다립니다!');
            } else {
                openModal('결과 확인', item ? item.label : '당첨 결과', item ? item.desc : '당첨 내용을 확인해 주세요.');
            }
        }

        // 버튼 클릭 시 IF-CX-051 호출 후 결과에 맞는 항목으로 룰렛을 회전시킵니다.
        async function handleSpinClick() {
            if (rouletteState.spinning || rouletteState.requestPending) {
                return;
            }
            if (rouletteState.availableTicketCount <= 0) {
                setApiStatus('응모권이 없습니다.', true);
                joinButton.disabled = true;
                restoreJoinButtonLabel();
                return;
            }

            try {
                setJoinButtonLoading(true, '서버 통신중...');
                setApiStatus('추첨 중...');
                const drawResult = await requestDrawResult();
                setAvailableTicketCount(rouletteState.availableTicketCount - 1);
                const targetIndex = findItemIndexByCouponName(
                    drawResult.isWinning === '1' ? drawResult.winningCouponName : null
                );
                setApiStatus(drawResult.isWinning === '1' ? '당첨! 결과를 확인하세요.' : '아쉽게도 꽝!');
                spin(targetIndex, drawResult);
            } catch (error) {
                setApiStatus('서버 오류: 랜덤으로 진행합니다.', true);
                console.warn('[roulette] handleSpinClick failed', error);
                spin(null, null);
            } finally {
                setJoinButtonLoading(false);
            }
        }

        // 페이지 초기화 시 대상/응모권 확인 후 캔버스를 최초 렌더링합니다.
        async function init() {
            setJoinButtonLoading(true, '초기화 중...');
            raffleButton.disabled = true;
            raffleButton.textContent = '초기화 중...';
            drawWheel(rouletteState.currentRotation);       // 로딩 상태 즉시 표시
            await initPageConfig();                         // 1. 서버에서 acntNo / eventId 주입
            await loadEventDefinitions();                   // 2. 이벤트 목록 / 경품 항목 서버에서 가져옴
            drawWheel(rouletteState.currentRotation);       // 3. 경품 항목이 반영된 휠 렌더링
            await loadRaffleStatus();                       // 4. 대상 여부 / 응모권 수 확인
            if (!joinButton.disabled) {
                setJoinButtonLoading(false);
            }
        }

        closeModal.addEventListener('click', closeResultModal);

        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) {
                closeResultModal();
            }
        });

        joinButton.addEventListener('click', handleSpinClick);

        // 응모권 참여 버튼 - 이벤트 신청대상 확인 API 호출
        raffleButton.addEventListener('click', async () => {
            if (raffleButton.disabled || rouletteState.requestPending) {
                return;
            }

            try {
                raffleButton.disabled = true;
                raffleButton.textContent = '확인 중...';
                setApiStatus('응모권 신청을 처리 중입니다...');

                const result = await checkTargetAndGetTicket();

                if (!result.isTarget) {
                    setApiStatus('이벤트 참여 대상이 아닙니다.', true);
                    raffleButton.disabled = true;
                    raffleButton.textContent = '참여 불가';
                    return;
                }

                if (result.raffleTicketCount <= 0) {
                    setApiStatus('응모권이 없습니다.', true);
                    raffleButton.disabled = true;
                    raffleButton.textContent = '응모권 소진';
                    return;
                }

                setAvailableTicketCount(result.raffleTicketCount);
                setApiStatus('');
                raffleButton.disabled = false;
                raffleButton.textContent = '응모권 참여 ✓';
                rouletteState.restoreStatusOnModalClose = false;
                openModal('응모권 획득', '', '룰렛판에서 "시작" 버튼을 눌러주세요.');
            } catch (error) {
                setApiStatus('응모권 확인 실패: ' + (error.message || ''), true);
                console.warn('[roulette] raffleButton click failed', error);
                raffleButton.disabled = false;
                raffleButton.textContent = '응모권 참여';
            }
        });

        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX - radius;
            const y = (event.clientY - rect.top) * scaleY - radius;
            const distance = Math.sqrt(x * x + y * y);

            if (distance <= 46 && !rouletteState.spinning && !rouletteState.requestPending) {
                handleSpinClick();
            }
        });

        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX - radius;
            const y = (event.clientY - rect.top) * scaleY - radius;
            const distance = Math.sqrt(x * x + y * y);

            canvas.style.cursor = (distance <= 46 && !rouletteState.spinning && !rouletteState.requestPending) ? 'pointer' : 'default';
        });

        init();
    })();
</script>
