<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="chatbotWidget">
    <link rel="stylesheet" th:href="@{/css/chatbot.css}">

    <button type="button" id="cb-toggle" class="cb-toggle" aria-label="챗봇 열기" hidden>🐶</button>

    <section id="cb-panel" class="cb-panel" role="dialog" aria-label="댕댕이 챗봇" hidden>
        <header class="cb-header">
            <span>🐶 댕댕이 도우미</span>
            <span>
                <button type="button" id="cb-reset" class="cb-icon-btn" title="대화 지우기">↺</button>
                <button type="button" id="cb-close" class="cb-icon-btn" aria-label="닫기">✕</button>
            </span>
        </header>
        <div id="cb-log" class="cb-log" aria-live="polite"></div>
        <form id="cb-form" class="cb-form" autocomplete="off">
            <textarea id="cb-input" rows="1" placeholder="무엇이든 물어보세요" maxlength="1000"></textarea>
            <button type="submit" id="cb-send">전송</button>
        </form>
        <p class="cb-note">AI 답변은 부정확할 수 있어요. 건강 문제는 수의사와 상담하세요.</p>
    </section>

    <script th:src="@{/js/chatbot.js}" defer></script>
</th:block>
</body>
</html>
