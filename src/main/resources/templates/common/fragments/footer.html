<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footerNav" class="footer">
    <div class="footer-wrapper">
        <!-- 푸터 메인 콘텐츠 -->
        <div class="footer-main">
            <!-- 브랜드 섹션 -->
            <div class="footer-brand">
                <div class="footer-logo">
                    <span class="logo-icon">🐶</span>
                    <span class="logo-text">댕댕이 월드</span>
                </div>
                <p class="footer-tagline">
                    전국 댕댕이 집사들을 위한 가장 따뜻한 공간 💕
                </p>
            </div>

            <!-- 링크 섹션 -->
            <div class="footer-links-section">
                <h4 class="footer-section-title">서비스</h4>
                <ul class="footer-link-list">
                    <li><a href="/board">커뮤니티</a></li>
                    <li><a href="/gallery">댕스토리</a></li>
                    <li><a href="/market">중고장터</a></li>
                </ul>
            </div>

            <div class="footer-links-section">
                <h4 class="footer-section-title">고객지원</h4>
                <ul class="footer-link-list">
                    <li><a href="/contact">문의하기</a></li>
                    <li><a href="/faq">자주 묻는 질문</a></li>
                    <li><a href="/notice">공지사항</a></li>
                </ul>
            </div>

            <div class="footer-links-section">
                <h4 class="footer-section-title">정책</h4>
                <ul class="footer-link-list">
                    <li><a href="/terms">이용약관</a></li>
                    <li><a href="/privacy">개인정보처리방침</a></li>
                    <li><a href="/agreement">이용동의</a></li>
                </ul>
            </div>
        </div>

        <!-- 푸터 하단 -->
        <div class="footer-bottom">
            <div class="footer-copyright">
                <p>&copy; 2026 <strong>댕댕이 월드</strong>. All rights reserved.</p>
            </div>
            <div class="footer-social">
                <a href="#" class="social-link" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="social-link" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" class="social-link" title="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
            </div>
        </div>
    </div>
</footer>

<style>
/* ====================================
   푸터 스타일
   ==================================== */

.footer {
    background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
    color: var(--white);
    margin-top: 5rem;
    padding: 3rem 0 2rem;
    border-top: 1px solid rgba(255, 140, 66, 0.2);
}

.footer-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
}

/* 푸터 메인 콘텐츠 */
.footer-main {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 3rem;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

/* 브랜드 섹션 */
.footer-brand {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.footer-logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
}

.footer-logo .logo-icon {
    font-size: 1.75rem;
}

.footer-logo .logo-text {
    background: linear-gradient(135deg, #FF8C42 0%, #FFD700 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.footer-tagline {
    opacity: 0.8;
    font-size: 0.95rem;
    line-height: 1.6;
}

/* 링크 섹션 */
.footer-links-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.footer-section-title {
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
    margin-bottom: 0.5rem;
}

.footer-link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.footer-link-list a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    font-size: 0.9rem;
    transition: var(--transition);
    display: inline-block;
}

.footer-link-list a:hover {
    color: var(--primary-color);
    margin-left: 0.25rem;
}

/* 푸터 하단 */
.footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 2rem;
    gap: 2rem;
}

.footer-copyright {
    font-size: 0.85rem;
    opacity: 0.7;
}

.footer-copyright p {
    margin: 0;
}

.footer-copyright strong {
    opacity: 1;
    color: var(--primary-color);
}

/* 소셜 링크 */
.footer-social {
    display: flex;
    gap: 1rem;
}

.social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    background: rgba(255, 140, 66, 0.15);
    color: var(--white);
    border-radius: 50%;
    text-decoration: none;
    font-size: 1rem;
    transition: var(--transition);
}

.social-link:hover {
    background: var(--primary-color);
    transform: translateY(-3px);
}

/* 반응형 디자인 */
@media (max-width: 1024px) {
    .footer-main {
        grid-template-columns: repeat(2, 1fr);
        gap: 2rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
    }

    .footer-bottom {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
    }

    .footer-social {
        justify-content: center;
    }
}

@media (max-width: 768px) {
    .footer {
        padding: 2rem 0 1.5rem;
        margin-top: 3rem;
    }

    .footer-wrapper {
        padding: 0 1.5rem;
    }

    .footer-main {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        padding-bottom: 1.5rem;
    }

    .footer-brand {
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer-bottom {
        flex-direction: column-reverse;
        text-align: center;
        gap: 1rem;
        padding-top: 1rem;
    }

    .footer-social {
        justify-content: center;
        gap: 0.75rem;
    }

    .social-link {
        width: 2.25rem;
        height: 2.25rem;
        font-size: 0.9rem;
    }

    .footer-copyright {
        font-size: 0.8rem;
    }
}

@media (max-width: 480px) {
    .footer {
        padding: 1.5rem 0 1rem;
        margin-top: 2rem;
    }

    .footer-wrapper {
        padding: 0 1rem;
    }

    .footer-logo {
        gap: 0.5rem;
        font-size: 1.1rem;
    }

    .footer-logo .logo-icon {
        font-size: 1.5rem;
    }

    .footer-tagline {
        font-size: 0.85rem;
    }

    .footer-section-title {
        font-size: 0.85rem;
    }

    .footer-link-list a {
        font-size: 0.8rem;
    }

    .footer-bottom {
        gap: 0.75rem;
    }

    .social-link {
        width: 2rem;
        height: 2rem;
        font-size: 0.8rem;
    }
}
</style>
</body>
</html>
