<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-spring-security6">

<head th:fragment="headerHead">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body>
<nav th:fragment="headerNav" class="navbar">
    <div class="navbar-container">
        <!-- 로고 -->
        <a href="/" class="navbar-logo">
            <span class="logo-icon">🐶</span>
            <span class="logo-text">댕댕이월드</span>
        </a>

        <!-- 네비게이션 메뉴 -->
        <div class="navbar-menu">
            <a href="/" class="navbar-link" title="홈">
                <i class="fas fa-home"></i>
                <span class="navbar-link-text">홈</span>
            </a>
            <a href="/board" class="navbar-link" title="커뮤니티">
                <i class="fas fa-comments"></i>
                <span class="navbar-link-text">커뮤니티</span>
            </a>
            <a href="/gallery" class="navbar-link" title="댕스토리">
                <i class="fas fa-images"></i>
                <span class="navbar-link-text">댕스토리</span>
            </a>
            <a href="/market" class="navbar-link" title="중고장터">
                <i class="fas fa-store"></i>
                <span class="navbar-link-text">중고장터</span>
            </a>

            <!-- 로그인 상태에 따라 다른 메뉴 표시 -->
            <div class="navbar-auth" sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    <span class="btn-text">로그인</span>
                </a>
            </div>

            <div class="navbar-auth" sec:authorize="isAuthenticated()">
                <a href="/mypage" class="navbar-link" title="마이페이지">
                    <i class="fas fa-user-circle"></i>
                    <span class="navbar-link-text">마이페이지</span>
                </a>
                <form th:action="@{/logout}" method="post" class="navbar-logout-form">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="btn-text">로그아웃</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
